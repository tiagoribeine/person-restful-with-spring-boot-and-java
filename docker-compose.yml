services:
  db:
    image: mysql:9.1.0
    container_name: mysql-db
    restart: always
    environment:
      TZ: America/Sao_Paulo
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3308:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - erudio-network

  rest-with-spring-boot-erudio:
    image: tiagoribeine/new-rest-with-spring-boot-and-java-erudio
    build: .
    restart: always
    # O entrypoint garante que o sleep 20 aconteça antes do Java tentar conectar
    entrypoint: ["sh", "-c", "sleep 20 && java -jar /app.jar"]
    environment:
      TZ: America/Sao_Paulo
      # Importante: a URL deve usar 'db' como host, que é o nome do serviço acima
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&autoReconnect=true
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - erudio-network

  portainer:
    image: portainer/portainer-ce:latest
    restart: always
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - erudio-network

volumes:
  portainer_data:

networks:
  erudio-network:
    driver: bridge