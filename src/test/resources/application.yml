server:
  port: 0
  #port: 8888
cors:
  originPatterns: http://localhost:8080,http://localhost:3000,https://www.erudio.com.br
file:
  upload-dir: ${UPLOAD_DIR_TEST}
security:
  jwt:
    token:
      #Configurações de geração do Token
      secret-key: ${SECRET_KEY:test_secret_only_for_unit_tests} #Chave secreta para assinar e verificar os tokens JWT
      expire-length: 3600000 #1 hora


email:
  subject: "Default Subject"
  message: "Default Message"

spring:
  application:
    name: rest-with-spring-boot-and-java-erudio
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
    show-sql: false
    open-in-view: false

  mail: #Nivel de 1x tab
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME} #Variável de ambiente - Informar email/senha no application.yml é falha grave de segurança
    password: ${EMAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enabled: true
      mail.smtp.starttls.required: true


  servlet:
    multipart:
      enabled: true
      file-size-threshold: 2KB
      max-file-size: 200MB
      max-request-size: 215 MB
logging:
  level:
    root: INFO
    # root: WARN
    # br.com.erudio: DEBUG
spring-doc:
  paths-to-match: /api/**/v1/**
  swagger-ui:
    use-root-path: true