name: Continuous Integration and Delivery with Github Actions

on:
  push:
    branches:
      - "main"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4 # More information on this action can be found below in the 'AWS Credentials' section
        with:
          aws-access-key-id: ${{AWS_ACCESS_KEY_ID}}
          aws-secret-access-key: ${{AWS_SECRET_ACCESS_KEY}}
          aws-region: ${{AWS_DEFAULT_REGION}}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'adopt'
          cache: maven

      - name: Build Application .jar
        working-directory: ./
        run: mvn clean package -DskipTests
        env:
          # Força o Testcontainers a ignorar a verificação de ambiente
          # e ajuda a encontrar o Docker daemon no GitHub Runner
          TESTCONTAINERS_RYUK_DISABLED: true
          DOCKER_HOST: unix:///var/run/docker.sock

      - name: Docker Compose Build
        working-directory: ./ #Comando deve ser executado onde está o docker composer yml - Por isso voltaremos um diretório
        run: docker compose build

      - name: Tag and Push Docker Image to Amazon Container Registry - ECR
        run: |
          docker tag ${{ secrets.DOCKER_USERNAME }}/new-rest-with-spring-boot-and-java-erudio:latest ${{ secrets.IMAGE_REPO_URL}}:latest      
          docker tag ${{ secrets.DOCKER_USERNAME }}/new-rest-with-spring-boot-and-java-erudio:latest ${{ secrets.IMAGE_REPO_URL}}:${{ github.run_id }}
          
          docker push ${{ secrets.IMAGE_REPO_URL}}:latest   
          docker push ${{ secrets.IMAGE_REPO_URL}}:${{ github.run_id }}

      - name: Push to Docker Hub Container Registry
        run: |
          docker tag ${{ secrets.DOCKER_USERNAME }}/new-rest-with-spring-boot-and-java-erudio:latest ${{ secrets.DOCKER_USERNAME }}/new-rest-with-spring-boot-and-java-erudio:${{ github.run_id }}
          
          docker push ${{ secrets.DOCKER_USERNAME }}/new-rest-with-spring-boot-and-java-erudio:latest  
          docker push ${{ secrets.DOCKER_USERNAME }}/new-rest-with-spring-boot-and-java-erudio:${{ github.run_id }}
          
          
          
          
          



